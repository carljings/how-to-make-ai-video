<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>给神经元装一个光开关 · 制作预览</title><link rel="icon" href="data:,"><link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#040911;color:#edf5fb;font:14px/1.5 system-ui,sans-serif}#stage{display:block;width:min(100vw,calc((100vh - 72px)*9/16));height:auto;margin:auto}.bar{display:flex;gap:12px;align-items:center;max-width:740px;margin:auto;padding:16px}.bar input{flex:1;min-width:60px}.bar button{padding:6px 12px;background:#183248;border:1px solid #40677f;color:#edf5fb;border-radius:6px}body.render .bar{display:none}body.render #stage{width:1080px}</style></head>
<body><canvas id="stage" width="1080" height="1920"></canvas><div class="bar"><button id="play">播放</button><input id="scrub" type="range" min="0" max="75" step="0.0333333" value="0" aria-label="时间轴"><output id="tc">0.00s</output></div>
<script type="module">
import {init,renderAt} from './src/film.js';import {W,H,DUR,FPS} from './src/timeline.js';
const canvas=document.getElementById('stage'),render=location.search.includes('render');if(render)document.body.classList.add('render');
await Promise.all([...document.fonts].map(f=>f.load()));await document.fonts.load('800 84px "Noto Film"');await document.fonts.ready;init(canvas);
window.frame=(t,q=.95)=>{renderAt(t);return canvas.toDataURL('image/jpeg',q)};
window.inspect=t=>renderAt(t);
window.sheet=(times,cols=5,w=270)=>{const h=Math.round(w*H/W),pad=8,s=document.createElement('canvas');s.width=cols*(w+pad)+pad;s.height=Math.ceil(times.length/cols)*(h+pad+27)+pad;const g=s.getContext('2d');g.fillStyle='#101b28';g.fillRect(0,0,s.width,s.height);const ms=[];times.forEach((t,i)=>{const start=performance.now();renderAt(t);ms.push(performance.now()-start);const x=pad+(i%cols)*(w+pad),y=pad+Math.floor(i/cols)*(h+pad+27);g.drawImage(canvas,x,y,w,h);g.font='16px monospace';g.fillStyle='#b7d5e4';g.fillText(t.toFixed(2)+'s',x+5,y+h+20)});return{url:s.toDataURL('image/jpeg',.95),ms}};
window.renderAudio=async path=>{const {renderScore,toWav}=await import('./src/score.js');const buf=await renderScore();await fetch('/save?path='+encodeURIComponent(path),{method:'POST',body:toWav(buf)});let peak=0;for(let c=0;c<buf.numberOfChannels;c++)for(const v of buf.getChannelData(c))peak=Math.max(peak,Math.abs(v));return{seconds:buf.duration,peakDb:20*Math.log10(peak||1e-9)}};
window.READY=true;
if(!render){const scrub=document.getElementById('scrub'),tc=document.getElementById('tc'),play=document.getElementById('play');let t=0,playing=false,start=0,audio=null,src=null;const show=()=>{renderAt(t);scrub.value=t;tc.value=t.toFixed(2)+'s'};const stop=()=>{playing=false;play.textContent='播放';if(src){try{src.stop()}catch{}src=null}};scrub.oninput=()=>{stop();t=+scrub.value;show()};play.onclick=async()=>{if(playing){stop();return}if(t>=DUR)t=0;if(!audio){try{const r=await fetch('out/mix.wav');if(r.ok){const ac=new AudioContext();audio={ac,buf:await ac.decodeAudioData(await r.arrayBuffer())}}}catch{}}if(audio){await audio.ac.resume();src=audio.ac.createBufferSource();src.buffer=audio.buf;src.connect(audio.ac.destination);src.start(0,t)}playing=true;play.textContent='暂停';start=performance.now()/1000-t;const tick=()=>{if(!playing)return;t=performance.now()/1000-start;if(t>=DUR){t=DUR;stop()}show();if(playing)requestAnimationFrame(tick)};requestAnimationFrame(tick)};show()}
</script></body></html>
