<style>
  html, body { margin: 0; background: #000; width: 1080px; height: 1920px; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #stage canvas { display: block; position: absolute; left: 0; top: 0; }
  .vignette { position: absolute; inset: 0; z-index: 1; background: radial-gradient(ellipse 80% 64% at 50% 48%, rgba(0,0,0,0) 58%, rgba(30,15,5,.45) 100%); }
  .flash { position: absolute; inset: 0; z-index: 5; background: #fff8ec; opacity: 0; }
  .subs, .labels { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .cue { position: absolute; font-family: "Noto Serif CJK SC", serif; font-weight: 700; color: #211b14; transform-origin: 50% 50%; }
  .cue em { font-style: normal; color: #c23b2e; }
  .cue.main { left: 60px; top: 150px; max-width: 900px; font-size: 70px; line-height: 1.3; background: rgba(251, 246, 236, .94);
    padding: 22px 34px 26px 30px; border-left: 12px solid #c23b2e; border-radius: 4px; box-shadow: 0 10px 30px rgba(40, 25, 10, .35); transform-origin: 0 50%; }
  .cue.big { left: 0; width: 1080px; top: 1010px; text-align: center; font-size: 200px; color: #c23b2e;
    text-shadow: 0 0 30px rgba(255, 250, 240, .95), 0 0 6px #fff; }
  .cue.count { left: 0; width: 1080px; top: 330px; text-align: center; font-size: 420px; line-height: 1; color: #c23b2e;
    text-shadow: 0 0 40px rgba(255, 250, 240, .95), 0 0 8px #fff; }
  .cue.note { left: 60px; top: 1392px; width: 860px; font-family: "Noto Sans CJK SC", sans-serif; font-size: 26px; font-weight: 400; line-height: 1.5;
    color: #3a3229; background: rgba(251, 246, 236, .93); padding: 12px 20px; border-radius: 4px; box-shadow: 0 6px 18px rgba(40, 25, 10, .25); box-sizing: border-box; }
  .tag { position: absolute; font-family: "Noto Sans CJK SC", sans-serif; font-weight: 700; font-size: 32px; color: #2a2119; white-space: nowrap;
    background: #fbf6ec; border: 3px solid #c23b2e; border-radius: 6px; padding: 4px 14px 6px; box-shadow: 0 4px 12px rgba(40, 25, 10, .35); }
  .tag small { font-weight: 400; font-size: 24px; color: #5a4c3d; }
  .tag.ink { border-color: #2a2119; }
  svg.lines { position: absolute; inset: 0; }
</style>
